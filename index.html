<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A tiny, cozy shelf of books to explore." />
    <title>Little Book Nook</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <p class="eyebrow">A little corner for readers</p>
        <h1>Little Book Nook <span aria-hidden="true">🌷</span></h1>
        <p>A tiny shelf of stories worth keeping.</p>
      </div>
    </header>

    <main class="container">
      <section class="shelf" aria-labelledby="books-heading">
        <p class="section-kicker">On the shelf</p>
        <div class="section-heading">
          <h2 id="books-heading">Pick a book <span id="book-count">—</span></h2>
        </div>

        <div id="filters" class="filters" role="group" aria-label="Filter books by genre">
          <button class="filter is-active" type="button" data-genre="all" aria-pressed="true">All</button>
        </div>

        <p id="status" class="status" role="status">Finding your books…</p>
        <div id="book-list" class="book-list" aria-live="polite"></div>
        <p id="empty-state" class="empty-state" hidden>No books found.</p>
      </section>
    </main>

    <dialog id="book-dialog" aria-labelledby="dialog-title">
      <form method="dialog"><button class="close-button" aria-label="Close details">Close</button></form>
      <p id="dialog-genre" class="dialog-genre"></p>
      <h2 id="dialog-title"></h2>
      <p id="dialog-author"></p>
      <p id="dialog-description"></p>
      <p id="dialog-year"></p>
    </dialog>

    <footer class="site-footer">
      <div class="container">Made with a little love for books ♡</div>
    </footer>
  </body>
</html>
